[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netdoctor"
dynamic = ["version"]
description = "Explain why a website is slow or unreachable: DNS, TCP, TLS, HTTP, ICMP and path diagnostics with root-cause analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ajitesh Mohapatra" }]
requires-python = ">=3.9"
dependencies = []  # standard library only, by design
keywords = ["network", "diagnostics", "dns", "tls", "troubleshooting", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking :: Monitoring",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "cryptography>=42"]

[project.urls]
Homepage = "https://github.com/Ajitesh1234/netdoctor"
Issues = "https://github.com/Ajitesh1234/netdoctor/issues"
Changelog = "https://github.com/Ajitesh1234/netdoctor/blob/main/CHANGELOG.md"

[project.scripts]
netdoctor = "netdoctor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "netdoctor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netdoctor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: needs real internet access (deselect with -m 'not network')"]

[tool.coverage.run]
source = ["netdoctor"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "BLE", "N"]
ignore = ["S101", "E501", "S603", "S607", "SIM108", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
strict = true
files = ["src/netdoctor"]
